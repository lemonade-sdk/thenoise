<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheNoise</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel-2: #161b26;
    --input: #1a1f2a;
    --border: #262c3a;
    --border-soft: #1e2430;
    --text: #e2e6ee;
    --dim: #8b93a5;
    --faint: #565e6f;
    --accent: #e3b341;
    --accent-soft: rgba(227, 179, 65, .14);
    --ok: #4ec9b0;
    --err: #f07178;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; min-height: 100vh; font-size: 14px;
  }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 440px; min-width: 440px;
    background: var(--panel); border-right: 1px solid var(--border);
    padding: 1.25rem 1.4rem;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 1.1rem;
  }
  .sidebar h1 { font-size: 1.05rem; font-weight: 650; letter-spacing: .01em; }
  .sidebar h1 .dot { color: var(--accent); }
  /* gallery toggle */
  .gallery-btn {
    display: none;
    background: var(--input);
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .35rem .6rem;
    font-size: .72rem;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: .05em;
    transition: border-color .12s, color .12s;
    justify-content: center;
  }
  .gallery-btn:hover { color: var(--text); }
  .gallery-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .gallery-btn.visible { display: flex; }
  .gallery-btn.visible { display: flex !important; }
  .field { display: flex; flex-direction: column; gap: .4rem; }
  .field > label { font-size: .78rem; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .sidebar input, .sidebar textarea, .sidebar select {
    background: var(--input); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: .55rem .65rem; font-size: .875rem;
    transition: border-color .12s, box-shadow .12s;
    width: 100%;
  }
  .sidebar input:focus, .sidebar textarea:focus, .sidebar select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .sidebar textarea { resize: vertical; min-height: 42px; line-height: 1.4; }
  .sidebar textarea#prompt { min-height: 180px; font-size: .95rem; }
  .sidebar textarea#negative_prompt { min-height: 70px; }

  /* lora autocomplete dropdown */
  .lora-field { position: relative; }
  .lora-ac {
    position: absolute; left: 0; right: 0; top: calc(100% + .3rem);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    max-height: 180px; overflow-y: auto; z-index: 30;
    box-shadow: 0 6px 24px rgba(0,0,0,.45); display: none;
  }
  .lora-ac.open { display: block; }
  .lora-ac .item { padding: .45rem .65rem; cursor: pointer; font-size: .82rem; }
  .lora-ac .item:hover, .lora-ac .item.sel { background: var(--accent-soft); color: var(--accent); }
  .lora-ac .empty { padding: .5rem .65rem; color: var(--faint); font-size: .8rem; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
  .hint { font-size: .72rem; color: var(--faint); font-weight: 400; text-transform: none; letter-spacing: 0; }

  /* range slider */
  .range { display: flex; flex-direction: column; gap: .4rem; }
  .range-head { display: flex; justify-content: space-between; align-items: baseline; }
  .range-head label { font-size: .78rem; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .range-head .val { font-size: .75rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    height: 5px; border-radius: 4px;
    background: var(--input); border: 1px solid var(--border);
    padding: 0; width: 100%; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: none; box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: none;
  }

  /* checkbox */
  .check { display: flex; align-items: center; gap: .55rem; font-size: .85rem; cursor: pointer; user-select: none; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

  /* section divider */
  .divider { height: 1px; background: var(--border-soft); margin: .15rem 0; }

  .btn {
    background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: .7rem 1rem;
    font-size: .92rem; font-weight: 600; cursor: pointer;
    transition: background .12s, transform .04s;
  }
  .btn:hover:not(:disabled) { background: #d19c2a; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: default; }
  /* download on hover */
  .stage .dl {
    position: absolute; top: 12px; right: 12px; z-index: 5;
    background: rgba(11, 14, 20, .82); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: .45rem .7rem; font-size: .78rem; cursor: pointer;
    display: flex; align-items: center; gap: .4rem;
    opacity: 0; transition: opacity .15s, border-color .12s;
    pointer-events: none;
  }
  .stage:hover .dl:not(:disabled) { opacity: 1; pointer-events: auto; }
  .stage .dl:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .stage .dl:disabled { display: none; }

  /* history strip */
  .history { width: 100%; }
  .history.hidden { display: none; }
  .history-head {
    font-size: .8rem; color: var(--dim); font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em; margin-bottom: .5rem;
  }
  .history-items { display: flex; gap: .6rem; overflow-x: auto; padding-bottom: .4rem; }
  .hist-item {
    flex: none; width: 96px; height: 96px; position: relative;
    border: 2px solid var(--border); border-radius: 8px; overflow: hidden;
    cursor: pointer; background: var(--panel);
  }
  .hist-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hist-item .hist-seed {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, .6); color: #ccc; font-size: .62rem;
    text-align: center; padding: .1rem 0; font-variant-numeric: tabular-nums;
  }
  .hist-item:hover { border-color: var(--faint); }
  .hist-item.current { border-color: var(--accent); }

  /* swap width/height */
  .swap-row { display: flex; gap: .6rem; align-items: flex-end; }
  .swap-row .field { flex: 1; }
  .swap {
    width: 34px; height: 34px; flex: none; padding: 0;
    background: var(--input); color: var(--dim);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 1.05rem; line-height: 1; cursor: pointer;
    transition: color .12s, border-color .12s;
  }
  .swap:hover { color: var(--accent); border-color: var(--accent); }

  /* gallery grid */
  .gallery-grid {
    display: none;
    flex-wrap: wrap;
    gap: .75rem;
    width: 100%;
    padding: 1rem 0;
  }
  .gallery-grid.visible { display: flex; }
  .gallery-grid .gallery-item {
    width: 120px;
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid var(--border);
    cursor: pointer;
    background: var(--panel);
    position: relative;
  }
  .gallery-grid .gallery-item:hover { border-color: var(--accent); }
  .gallery-grid .gallery-item.selected { border-color: var(--accent); }
  .gallery-grid .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .gallery-grid .gallery-item .seed-label {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, .6);
    color: #ccc;
    font-size: .58rem;
    text-align: center;
    padding: .1rem 0;
    font-variant-numeric: tabular-nums;
  }
  .gallery-grid .gallery-item.loading img {
    opacity: 0;
  }
  .gallery-grid .gallery-item.loading::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 6px;
    background: var(--panel);
    animation: pulse-bg 1.2s ease-in-out infinite;
  }
  @keyframes pulse-bg {
    0%, 100% { background: var(--panel); }
    50% { background: var(--panel-2); }
  }
  .main-title { display: flex; align-items: baseline; gap: .5rem; }

  /* ---------- main ---------- */
  .main {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 2rem 1.5rem; gap: 1rem;
  }
  .stage {
    flex: 1; min-width: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 1rem; position: relative; overflow: hidden;
  }
  .stage img {
    max-width: 100%; max-height: 100%;
    border-radius: 8px; object-fit: contain; display: block;
  }
  .stage .placeholder { color: var(--faint); font-size: .95rem; text-align: center; line-height: 1.6; }
  .stage .placeholder .kbd { color: var(--dim); }
  .stage .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(11, 14, 20, .55); backdrop-filter: blur(1.5px);
  }
  .overlay.hidden { display: none; }
  .overlay .spinner {
    width: 42px; height: 42px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* timer bar under image */
  .timer {
    font-size: .8rem; color: var(--dim);
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
    min-height: 1.2em; display: flex; align-items: center; gap: .5rem;
  }
  .timer .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .timer.running .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  .timer.done .dot { background: var(--ok); }
  .timer.error .dot { background: var(--err); }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  /* collapsible info panel */
  .info { width: 100%; }
  .info summary {
    cursor: pointer; list-style: none;
    font-size: .8rem; color: var(--dim);
    font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
    padding: .45rem .25rem; user-select: none;
    display: flex; align-items: center; gap: .5rem;
  }
  .info summary::-webkit-details-marker { display: none; }
  .info summary .chev { font-size: .7rem; transition: transform .15s; display: inline-block; }
  .info[open] summary .chev { transform: rotate(90deg); }
  .info summary:hover { color: var(--text); }
  .info-body {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: .9rem 1rem; max-height: 40vh; overflow-y: auto;
  }
  .info-grid { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1.2rem; font-size: .8rem; }
  .info-grid dt { color: var(--faint); font-weight: 600; white-space: nowrap; }
  .info-grid dd { color: var(--text); word-break: break-word; }
  .info-grid dd.prompt { white-space: pre-wrap; }
  .info-grid dd.none { color: var(--faint); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="main-title">
    <h1>The<span class="dot">Noise</span></h1>
  </div>

  <div class="divider"></div>

  <div class="field">
    <label for="prompt">Prompt</label>
    <textarea id="prompt" placeholder="Describe the image…"></textarea>
  </div>

  <div class="field">
    <label for="negative_prompt">Negative prompt <span class="hint">optional</span></label>
    <textarea id="negative_prompt" placeholder=""></textarea>
  </div>

  <div class="divider"></div>

  <div class="swap-row">
    <div class="field">
      <label for="width">Width</label>
      <input type="number" id="width" placeholder="auto" value="1024">
    </div>
    <button class="swap" id="swap" title="Swap width and height" aria-label="Swap width and height">&#8646;</button>
    <div class="field">
      <label for="height">Height</label>
      <input type="number" id="height" placeholder="auto" value="1024">
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label for="steps">Steps</label>
      <input type="number" id="steps" placeholder="auto">
    </div>
    <div class="field">
      <label for="guidance_scale">Guidance</label>
      <input type="number" id="guidance_scale" step="0.1" placeholder="auto">
    </div>
  </div>

  <div class="field">
    <label for="sampler">Sampler</label>
    <select id="sampler">
      <option value="er_sde">er_sde</option>
      <option value="euler">euler</option>
    </select>
  </div>

  <div class="field">
    <label for="seed">Seed</label>
    <input type="number" id="seed" placeholder="random">
  </div>

  <div class="divider"></div>

  <div class="range">
    <div class="range-head">
      <label for="film_grain">Film grain</label>
      <span class="val" id="film_grain_val">0.00</span>
    </div>
    <input type="range" id="film_grain" min="0" max="1" step="0.1" value="0">
  </div>

  <div class="range">
    <div class="range-head">
      <label for="sharpening">Sharpening</label>
      <span class="val" id="sharpening_val">0.00</span>
    </div>
    <input type="range" id="sharpening" min="0" max="1" step="0.05" value="0">
  </div>

  <div class="field">
    <label for="upscale_type">Upscale type</label>
    <select id="upscale_type">
      <option value="refined">refined (latent 2x + refiner)</option>
      <option value="no-refiner">no-refiner (pixel upscaler only)</option>
    </select>
  </div>

  <div class="field">
    <label for="pixel_upscaler">Pixel upscaler <span class="hint">(from --upscaler-dir)</span></label>
    <select id="pixel_upscaler">
      <option value="">none</option>
    </select>
  </div>

  <div class="range">
    <div class="range-head">
      <label for="upscale_factor">Upscale factor</label>
      <span class="val" id="upscale_factor_val">1.00</span>
    </div>
    <input type="range" id="upscale_factor" min="1" max="8" step="0.25" value="1">
  </div>

  <label class="check"><input type="checkbox" id="qwen_vae_enhance"> Reduce grid pattern <span class="hint">(enable when needed)</span></label>

  <div class="divider"></div>

  <div class="field lora-field">
    <label for="lora_specs">LoRA specs <span class="hint">type to autocomplete</span></label>
    <textarea id="lora_specs" rows="2" placeholder="e.g. style:0.8, one per line"></textarea>
    <div class="lora-ac" id="lora_ac"></div>
  </div>

  <button class="btn" id="generate">Generate</button>

  <button class="gallery-btn" id="galleryBtn" disabled>Gallery</button>
</aside>

<main class="main">
  <div class="stage" id="stage">
    <div class="placeholder" id="placeholder">Enter a prompt and click <span class="kbd">Generate</span></div>
    <img id="image" alt="generated" style="display:none">
    <button class="dl" id="download" disabled title="Download PNG">&#8595; Download</button>
    <div class="overlay hidden" id="overlay">
      <div class="spinner"></div>
    </div>
  </div>

  <div class="timer" id="timer"><span class="dot"></span><span id="timer_text">idle</span></div>

  <details class="info" id="info">
    <summary><span class="chev">&#9654;</span> Image info</summary>
    <div class="info-body">
      <dl class="info-grid" id="info_grid"></dl>
    </div>
  </details>

  <div class="gallery-grid" id="galleryGrid"></div>

  <div class="history" id="history">
    <div class="history-head">History</div>
    <div class="history-items" id="history_items"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let currentUrl = null;
let currentMeta = null;
let history = []; // newest first, capped at 10: {url, meta, time}

$('film_grain').addEventListener('input', e => $('film_grain_val').textContent = parseFloat(e.target.value).toFixed(2));
$('sharpening').addEventListener('input', e => $('sharpening_val').textContent = parseFloat(e.target.value).toFixed(2));
$('upscale_factor').addEventListener('input', e => $('upscale_factor_val').textContent = parseFloat(e.target.value).toFixed(2));
$('upscale_type').addEventListener('change', updateUpscaleMax);

// Cap the factor slider to the type's max (no-refiner has no latent 2x multiplier).
function updateUpscaleMax() {
  const slider = $('upscale_factor');
  const max = $('upscale_type').value === 'no-refiner' ? 4 : 8;
  slider.max = max;
  if (parseFloat(slider.value) > max) {
    slider.value = max;
    $('upscale_factor_val').textContent = max.toFixed(2);
  }
}

function setTimer(state, text) {
  const t = $('timer');
  t.className = 'timer ' + state;
  $('timer_text').textContent = text;
}

/* ---------- PNG metadata decoding ---------- */
// Reads the "generation_data" tEXt chunk (Latin-1 encoded, uncompressed).
function readPngText(bytes) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const texts = {};
  if (dv.getUint32(0) !== 0x89504e47) return texts; // not a PNG
  let off = 8; // skip signature
  while (off + 8 <= bytes.byteLength) {
    const len = dv.getUint32(off);
    const type = String.fromCharCode(
      dv.getUint8(off + 4), dv.getUint8(off + 5),
      dv.getUint8(off + 6), dv.getUint8(off + 7)
    );
    const start = off + 8;
    if (type === 'tEXt') {
      // keyword: null-terminated Latin-1; text: rest of chunk
      const chunk = bytes.subarray(start, start + len);
      let sep = -1;
      for (let i = 0; i < chunk.length; i++) if (chunk[i] === 0) { sep = i; break; }
      if (sep >= 0) {
        const keyword = decodeLatin1(chunk.subarray(0, sep));
        const value = decodeLatin1(chunk.subarray(sep + 1));
        texts[keyword] = value;
      }
    }
    off = start + len + 4; // skip data + crc
  }
  return texts;
}
function decodeLatin1(bytes) {
  // Latin-1 -> UTF-8 string (PNG tEXt is Latin-1; JSON may contain UTF-8 chars
  // encoded as Latin-1 bytes, so re-encode to UTF-8 before decodeURIComponent).
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return s;
}

/* ---------- info panel rendering ---------- */
const FIELD_LABELS = {
  model: 'Model', prompt: 'Prompt', negative_prompt: 'Negative prompt',
  width: 'Width', height: 'Height', steps: 'Steps',
  guidance_scale: 'CFG scale', seed: 'Seed', upscale: 'Upscale',
  upscale_factor: 'Upscale factor', upscale_type: 'Upscale type',
  sampler: 'Sampler', qwen_vae_enhance: 'Reduce grid pattern',
  film_grain: 'Film grain', sharpening: 'Sharpening', lora_specs: 'LoRA',
};

function renderInfo(meta) {
  const grid = $('info_grid');
  grid.innerHTML = '';
  if (!meta || typeof meta !== 'object') {
    const dd = document.createElement('dd');
    dd.className = 'none';
    dd.textContent = 'No metadata found in this image.';
    grid.appendChild(dd);
    return;
  }
  const bools = ['upscale', 'qwen_vae_enhance'];
  const add = (label, value, cls) => {
    const dt = document.createElement('dt'); dt.textContent = label;
    const dd = document.createElement('dd'); if (cls) dd.className = cls;
    if (Array.isArray(value)) dd.textContent = value.join(', ') || '—';
    else dd.textContent = value ?? '—';
    grid.append(dt, dd);
  };
  for (const key of ['model','prompt','negative_prompt','width','height','steps','sampler','guidance_scale','seed']) {
    if (key in meta) add(FIELD_LABELS[key], meta[key], key === 'prompt' || key === 'negative_prompt' ? 'prompt' : '');
  }
  if ('upscale' in meta) add('Upscale', meta.upscale);
  if ('upscale_factor' in meta) add('Upscale factor', meta.upscale_factor);
  if ('upscale_type' in meta) add('Upscale type', meta.upscale_type);
  if ('pixel_upscaler' in meta && meta.pixel_upscaler) add('Pixel upscaler', meta.pixel_upscaler);
  if ('qwen_vae_enhance' in meta) add('Reduce grid pattern', meta.qwen_vae_enhance);
  for (const key of ['film_grain','sharpening','lora_specs']) {
    if (key in meta && (key !== 'film_grain' || meta.film_grain) && (key !== 'sharpening' || meta.sharpening)) {
      add(FIELD_LABELS[key], meta[key], '');
    }
  }
}

async function decodeMeta(blob) {
  const buf = await blob.arrayBuffer();
  const texts = readPngText(new Uint8Array(buf));
  let meta = null;
  try { meta = texts['generation_data'] ? JSON.parse(texts['generation_data']) : null; }
  catch { meta = null; }
  currentMeta = meta;
  renderInfo(meta);
  return meta;
}

/* ---------- history ---------- */
function addToHistory(url, meta) {
  history.unshift({ url, meta, time: Date.now() });
  if (history.length > 10) {
    const removed = history.pop();
    if (removed.url) URL.revokeObjectURL(removed.url);
  }
  renderHistory();
}

function renderHistory() {
  const container = $('history_items');
  container.innerHTML = '';
  history.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'hist-item' + (i === 0 ? ' current' : '');
    const img = document.createElement('img');
    img.src = item.url;
    img.alt = 'generation ' + (i + 1);
    div.appendChild(img);
    const seed = document.createElement('span');
    seed.className = 'hist-seed';
    seed.textContent = item.meta && item.meta.seed != null ? item.meta.seed : '';
    div.appendChild(seed);
    div.addEventListener('click', () => selectHistory(i));
    container.appendChild(div);
  });
  $('history').classList.toggle('hidden', history.length === 0);
}

function selectHistory(i) {
  const item = history[i];
  if (!item) return;
  currentUrl = item.url;
  currentMeta = item.meta;
  $('image').src = item.url;
  $('image').style.display = 'block';
  $('placeholder').style.display = 'none';
  renderInfo(item.meta);
  applySettings(item.meta);
  $('download').disabled = false;
  const items = $('history_items').querySelectorAll('.hist-item');
  items.forEach((el, idx) => el.classList.toggle('current', idx === i));
}

/* ---------- copy settings from metadata ---------- */
function applySettings(meta) {
  if (!meta) return;
  $('prompt').value = meta.prompt ?? '';
  $('negative_prompt').value = meta.negative_prompt ?? '';
  if (meta.width != null) $('width').value = meta.width;
  if (meta.height != null) $('height').value = meta.height;
  if (meta.steps != null) $('steps').value = meta.steps;
  if (meta.guidance_scale != null) $('guidance_scale').value = meta.guidance_scale;
  if (meta.seed != null) $('seed').value = meta.seed;
  if (meta.sampler) $('sampler').value = meta.sampler;
  if (meta.upscale_factor != null) {
    $('upscale_factor').value = meta.upscale_factor;
    $('upscale_factor_val').textContent = meta.upscale_factor.toFixed(2);
  } else if (meta.upscale === true) {
    // legacy metadata: 'upscale: true' == 2x refined
    $('upscale_factor').value = 2;
    $('upscale_factor_val').textContent = '2.00';
    $('upscale_type').value = 'refined';
  }
  if (meta.upscale_type) $('upscale_type').value = meta.upscale_type;
  updateUpscaleMax();
  if (meta.qwen_vae_enhance != null) $('qwen_vae_enhance').checked = meta.qwen_vae_enhance;
  if (meta.film_grain != null) {
    $('film_grain').value = meta.film_grain;
    $('film_grain_val').textContent = meta.film_grain.toFixed(2);
  }
  if (meta.sharpening != null) {
    $('sharpening').value = meta.sharpening;
    $('sharpening_val').textContent = meta.sharpening.toFixed(2);
  }
  if (Array.isArray(meta.lora_specs)) {
    $('lora_specs').value = meta.lora_specs.join('\n');
  }
  if (meta.pixel_upscaler) {
    $('pixel_upscaler').value = meta.pixel_upscaler;
  }
}

/* ---------- swap width/height ---------- */
$('swap').addEventListener('click', () => {
  const w = $('width'), h = $('height');
  const tmp = w.value; w.value = h.value; h.value = tmp;
});

/* ---------- download image ---------- */
function downloadImage() {
  if (!currentUrl) return;
  const seed = currentMeta && currentMeta.seed != null ? currentMeta.seed : 'x';
  const a = document.createElement('a');
  a.href = currentUrl;
  a.download = `thenoise_${seed}.png`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}
$('download').addEventListener('click', downloadImage);

/* ---------- lora autocomplete ---------- */
let loras = [];

async function loadLoras() {
  try {
    const res = await fetch('/lora');
    if (res.ok) {
      const data = await res.json();
      loras = (data.loras || []).sort();
    }
  } catch (e) { loras = []; }
}

/* ---------- pixel upscaler select ---------- */
async function loadUpscalers() {
  const sel = $('pixel_upscaler');
  const none = sel.firstElementChild; // the empty 'none' option
  sel.innerHTML = '';
  sel.appendChild(none);
  try {
    const res = await fetch('/upscalers');
    if (res.ok) {
      const data = await res.json();
      for (const name of (data.upscalers || []).sort()) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      }
    }
  } catch (e) { /* leave just 'none' */ }
}

const acEl = () => $('lora_ac');

function openAc() { acEl().classList.add('open'); }
function closeAc() { acEl().classList.remove('open'); acEl().innerHTML = ''; }

function tokenAtCursor(ta) {
  const s = ta.selectionStart;
  const before = ta.value.slice(0, s);
  const nl = before.lastIndexOf('\n');
  const lineStart = nl === -1 ? 0 : nl + 1;
  const sp = before.lastIndexOf(' ');
  const tokenStart = sp > lineStart ? sp + 1 : lineStart;
  return { token: ta.value.slice(tokenStart, s).trim(), tokenStart };
}

function insertLora(name, tokenStart) {
  const ta = $('lora_specs');
  const s = ta.selectionStart;
  ta.value = ta.value.slice(0, tokenStart) + name + ta.value.slice(s);
  const pos = tokenStart + name.length;
  ta.setSelectionRange(pos, pos);
  ta.focus();
}

function renderAc(items, tokenStart) {
  const ac = acEl();
  ac.innerHTML = '';
  if (!items.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = 'No matching LoRAs';
    ac.appendChild(d);
    openAc();
    return;
  }
  items.forEach(name => {
    const d = document.createElement('div');
    d.className = 'item';
    d.dataset.name = name;
    d.dataset.tokenStart = tokenStart;
    d.textContent = name;
    ac.appendChild(d);
  });
  openAc();
}

$('lora_specs').addEventListener('input', () => {
  const ta = $('lora_specs');
  const { token, tokenStart } = tokenAtCursor(ta);
  if (token.length < 2) { closeAc(); return; }
  const q = token.toLowerCase();
  renderAc(loras.filter(n => n.toLowerCase().includes(q)), tokenStart);
});

acEl().addEventListener('mousedown', e => {
  const item = e.target.closest('.item');
  if (!item) return;
  e.preventDefault();
  insertLora(item.dataset.name, parseInt(item.dataset.tokenStart, 10));
  closeAc();
});

$('lora_specs').addEventListener('keydown', e => {
  if (!acEl().classList.contains('open')) return;
  if (e.key === 'Escape') { closeAc(); return; }
  const items = acEl().querySelectorAll('.item');
  if (!items.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    let idx = -1;
    items.forEach((it, i) => { if (it.classList.contains('sel')) idx = i; });
    idx = e.key === 'ArrowDown'
      ? (idx + 1) % items.length
      : (idx === -1 ? items.length - 1 : (idx - 1 + items.length) % items.length);
    items.forEach((it, i) => it.classList.toggle('sel', i === idx));
  } else if (e.key === 'Enter' || e.key === 'Tab') {
    const sel = acEl().querySelector('.item.sel');
    if (sel) {
      e.preventDefault();
      insertLora(sel.dataset.name, parseInt(sel.dataset.tokenStart, 10));
      closeAc();
    }
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.lora-field')) closeAc();
});

loadLoras();
loadUpscalers();

/* ---------- generate ---------- */
$('generate').addEventListener('click', async () => {
  const btn = $('generate');
  const stage = $('stage');
  const img = $('image');
  const overlay = $('overlay');

  btn.disabled = true;

  // keep the previous image visible, dim it, show the live timer under it
  overlay.classList.remove('hidden');
  const start = Date.now();
  setTimer('running', '0.0s');
  const timer = setInterval(() => {
    setTimer('running', ((Date.now() - start) / 1000).toFixed(1) + 's');
  }, 100);

  const body = {
    prompt: $('prompt').value,
    negative_prompt: $('negative_prompt').value,
    upscale_factor: parseFloat($('upscale_factor').value),
    upscale_type: $('upscale_type').value,
    pixel_upscaler: $('pixel_upscaler').value || null,
    qwen_vae_enhance: $('qwen_vae_enhance').checked,
    film_grain: parseFloat($('film_grain').value),
    sharpening: parseFloat($('sharpening').value),
    lora_specs: $('lora_specs').value.trim()
      ? $('lora_specs').value.split('\n').map(l => l.trim()).filter(Boolean)
      : null,
  };

  const numFields = ['width', 'height', 'steps', 'seed'];
  for (const f of numFields) {
    const v = $(f).value;
    if (v !== '') body[f] = parseInt(v, 10);
  }
  const floatFields = ['guidance_scale'];
  for (const f of floatFields) {
    const v = $(f).value;
    if (v !== '') body[f] = parseFloat(v);
  }
  const samplerVal = $('sampler').value;
  if (samplerVal) body.sampler = samplerVal;

  try {
    const res = await fetch('/text2image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err || res.statusText);
    }
    const blob = await res.blob();
    currentUrl = URL.createObjectURL(blob);
    $('download').disabled = false;
    img.src = currentUrl;
    img.style.display = 'block';
    $('placeholder').style.display = 'none';
    const meta = await decodeMeta(blob);
    addToHistory(currentUrl, meta);
    clearInterval(timer);
    setTimer('done', ((Date.now() - start) / 1000).toFixed(1) + 's');
  } catch (e) {
    clearInterval(timer);
    setTimer('error', 'error: ' + e.message);
  } finally {
    overlay.classList.add('hidden');
    btn.disabled = false;
  }
});

/* ---------- gallery mode ---------- */
let activeTab = 'generate'; // 'generate' | 'gallery'
let galleryItems = [];

function showGallery(show) {
  activeTab = show ? 'gallery' : 'generate';
  const isGallery = activeTab === 'gallery';
  $('galleryBtn').classList.toggle('active', isGallery);
  $('galleryGrid').classList.toggle('visible', isGallery);
  $('history').classList.toggle('hidden', isGallery);
  $('timer').style.display = isGallery ? 'none' : '';
  $('info').style.display = isGallery ? 'none' : '';
  if (!isGallery) {
    currentUrl = null;
    currentMeta = null;
  }
  if (isGallery) {
    loadGallery();
  }
}

function renderGallery() {
  const grid = $('galleryGrid');
  grid.innerHTML = '';
  galleryItems.forEach(item => {
    const div = document.createElement('div');
    div.className = 'gallery-item' + (item.url === currentUrl ? ' selected' : '');
    const img = document.createElement('img');
    img.src = item.url;
    img.alt = 'gallery image';
    div.appendChild(img);
    const seed = document.createElement('span');
    seed.className = 'seed-label';
    seed.textContent = item.meta && item.meta.seed != null ? item.meta.seed : '';
    div.appendChild(seed);
    div.addEventListener('click', () => selectGalleryItem(item));
    grid.appendChild(div);
  });
}

function selectGalleryItem(item) {
  currentUrl = item.url;
  currentMeta = item.meta;
  const img = $('image');
  img.src = item.url;
  img.style.display = 'block';
  $('placeholder').style.display = 'none';

  if (item.meta) {
    renderInfo(item.meta);
    applySettings(item.meta);
  }

  $('download').disabled = false;
  $('galleryGrid').querySelectorAll('.gallery-item').forEach((el, i) => {
    el.classList.toggle('selected', galleryItems[i] === item);
  });
}

function loadGallery() {
  fetch('/gallery').then(r => r.json()).then(items => {
    if (items && items.length > 0) {
      galleryItems = items;
      renderGallery();
    }
  }).catch(() => {});
}

// Initial gallery load
fetch('/gallery').then(r => r.json()).then(items => {
  if (items && items.length > 0) {
    const btn = $('galleryBtn');
    if (btn) {
      btn.classList.add('visible');
      btn.disabled = false;
    }
    galleryItems = items;
    renderGallery();
    if (activeTab !== 'gallery') {
      showGallery(true);
    }
  }
}).catch(() => {});

// Single click handler
$('galleryBtn').addEventListener('click', () => {
  showGallery(activeTab !== 'gallery');
});


</script>
