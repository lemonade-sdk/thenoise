name: Build TheNoise Docker image (ROCm)

# Builds the ROCm container image (docker/Dockerfile) and publishes it to GHCR,
# one image per GPU target because the ROCm wheels carry device-specific code
# objects: ghcr.io/<owner>/thenoise:gfx1151, :<version>-gfx1151, and :latest for
# the primary target.
#
# Triggers:
#   * git tag matching v*        -> build + smoke test + push. A release is the
#     only thing that moves the rolling :gfx<target> / :latest tags.
#   * workflow_dispatch          -> build + smoke test. With the push_image
#     toggle on it publishes as :edge-gfx<target>, never as :gfx<target>, so a
#     test build cannot repoint what the docs tell people to pull.
#   * pull_request + the `docker-build` label -> build + smoke test, no push (a
#     fork's token is read-only for packages, and PR images are not worth
#     keeping). Label-gated because a build is 30+ minutes and several GB of
#     wheels, and `pull_request` would otherwise fire on every push to the
#     branch — including the ones nobody asked about.
#
# Only gfx1151 is published by default. Every image is ~10 GB and every build
# downloads several GB of ROCm wheels, so widening the matrix is a deliberate
# act — the workflow_dispatch `gfx_target` input takes a comma-separated list,
# and anyone on another target can build it locally in one command:
#   docker build -f docker/Dockerfile --build-arg GFX_ARCH=gfx1150 .
#
# The smoke test runs without a GPU. It checks the two things that can silently
# break the container while the portable bundle keeps working: the launcher
# coming up behind the entrypoint, and the image carrying the system libraries
# the ROCm wheels expect but do not vendor (import torch is what pulls them in).
# A real generation inside a container still has to happen on a ROCm box — see
# docs/docker.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      gfx_target:
        description: 'AMD GPU targets (comma-separated)'
        required: false
        default: 'gfx1151'
      push_image:
        description: 'Push the built image to GHCR'
        required: false
        default: false
        type: boolean
  pull_request:
    # `labeled` is in the list, `synchronize` (every push) is not: an open pull
    # request builds nothing until a reviewer puts the label on it.
    types: [opened, labeled]
    paths:
      - 'docker/**'
      - 'build-scripts/**'
      - 'thenoise/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.dockerignore'
      - '.github/workflows/build-docker-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    # One gate for the whole workflow: with nothing to build, the build job
    # needs this one and is skipped along with it. To re-run a pull request
    # build after pushing, take the label off and put it back on; the label has
    # to exist in the repository's labels settings.
    if: ${{ github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'docker-build') }}
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      push: ${{ steps.set.outputs.push }}
      tag_prefix: ${{ steps.set.outputs.tag_prefix }}
    steps:
      - name: Set inputs
        id: set
        env:
          GFX_IN: ${{ github.event.inputs.gfx_target }}
          PUSH_IN: ${{ github.event.inputs.push_image }}
        run: |
          set -euo pipefail
          targets="${GFX_IN:-gfx1151}"
          matrix=$(echo "$targets" | tr ',' '\n' | sed 's/^ *//;s/ *$//' \
            | jq -R . | jq -s '{gfx_target:.}' | jq -c)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # A tag is a release, so it publishes. A manual run publishes only if
          # asked. A pull request never can (fork tokens are read-only).
          if [ "${{ github.event_name }}" = push ]; then push=true
          elif [ "$PUSH_IN" = true ]; then push=true
          else push=false; fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          # The rolling tag is a pointer, so only a release may move it: a
          # manual build publishes beside it as edge-gfx<target>.
          if [ "${{ github.event_name }}" = push ]; then prefix=gfx
          else prefix=edge-gfx; fi
          echo "tag_prefix=$prefix" >> "$GITHUB_OUTPUT"

  build-image:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          # GHCR refs must be lowercase and github.repository_owner is not
          # guaranteed to be.
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/thenoise" >> "$GITHUB_OUTPUT"

      # The bundle is ~10 GB, the image that contains it another ~10 GB, and
      # the smoke test wants a third copy in the daemon. The runner images carry
      # toolchains no build here uses, so they go first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                     /opt/hostedtoolcache/CodeQL
          df -h / || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.prepare.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            # v0.12.1 -> 0.12.1-gfx1151
            type=semver,pattern={{version}},suffix=-gfx${{ matrix.gfx_target }}
            # the rolling per-target tag the docs point at; edge-gfx<target>
            # for anything that is not a release (see prepare)
            type=raw,value=${{ needs.prepare.outputs.tag_prefix }}${{ matrix.gfx_target }}
            # and :latest for the primary target, releases only
            type=raw,value=latest,enable=${{ matrix.gfx_target == 'gfx1151' && github.event_name == 'push' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            GFX_ARCH=${{ matrix.gfx_target }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            # An unprefixed name resolves to docker.io/library/<name>, and every
            # tag in this list gets pushed whenever push is on — the GHCR token
            # cannot mint a docker.io scope. So the smoke tag exists only on the
            # paths that load into the daemon instead of publishing.
            ${{ needs.prepare.outputs.push != 'true' && format('thenoise-smoke:{0}', matrix.gfx_target) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ needs.prepare.outputs.push == 'true' }}
          # When nothing was pushed, load the build into the daemon so the
          # smoke test below has an image to run.
          load: ${{ needs.prepare.outputs.push != 'true' }}
          # One plain image per tag: no provenance attestation manifest beside
          # it, and no second artifact per release.
          provenance: false
          # Deliberately no cache-from/cache-to: the layer worth caching is the
          # ~10 GB ROCm one, and it changes with every release.

      - name: Smoke test (no GPU)
        run: |
          set -euo pipefail
          if [ '${{ needs.prepare.outputs.push }}' = true ]; then
            # Publish first, then test what the registry handed back — naming the
            # tag outright means this fails if the tag is not there.
            ref="${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.tag_prefix }}${{ matrix.gfx_target }}"
            docker pull --quiet "$ref"
          else
            ref="thenoise-smoke:${{ matrix.gfx_target }}"
          fi
          # entrypoint -> launcher -> argparse
          docker run --rm "$ref" --help >/dev/null
          # torch import is the load-bearing check: it pulls in libgomp,
          # libatomic and the bundled ROCm libraries.
          docker run --rm --entrypoint python3 "$ref" \
            -c 'import torch, torchvision, thenoise, fastapi; print("torch", torch.__version__)'
          echo "image=${ref}" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect --format 'size={{.Size}} bytes' "$ref" \
            | tee -a "$GITHUB_STEP_SUMMARY"
