name: Build TheNoise + ROCm (portable)

# Builds relocatable "portable" thenoise bundles (standalone CPython + PyTorch
# ROCm + all deps + thenoise + bundled ROCm runtime) for each requested GPU
# target, on BOTH Linux and Windows. Each platform's gfx1151 bundle is
# qualified with a real generation on a dev_lab GPU box, then all platform
# assets are attached to a single GitHub release. Modeled on the org's
# vllm-rocm pipeline.
#
# Triggers:
#   * every git tag matching v*  -> build + qualify + release
#   * manual workflow_dispatch   -> build + qualify (+ release only if the
#     create_release toggle is enabled; it defaults to false for testing)
#
# The build jobs run on GitHub-hosted runners: they need no GPU, only outbound
# HTTPS to rc.repo.amd.com, pypi.org and github.com. The self-hosted dev_lab
# group is required only for GPU qualification (a real gfx1151 box — Strix
# Halo's GPU is an iGPU, so it cannot be passed through to a VM), and can still
# take the builds via the self_hosted input.
#
# workflow_dispatch inputs (each one exists so that a single unavailable
# dependency never blocks a release):
#   * gfx_target          comma-separated GPU targets
#   * create_release      attach assets to a release when everything passed
#   * platforms           linux / windows / both — an outage on one platform's
#                         runner must not block releasing the other
#   * skip_qualification  release on build success alone (GPU box down). The
#                         release notes then state that the bundles are not
#                         GPU-qualified, so it stays visible to users.
#   * self_hosted         build on dev_lab instead of GitHub-hosted runners
#   * skip_verify         tolerate the torch/torchvision import smoke test
#                         inside build_portable.* (a runner-image limitation,
#                         not a bundle defect; GPU qualification is the real
#                         test)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      gfx_target:
        description: 'AMD GPU targets (comma-separated)'
        required: false
        default: 'gfx1151,gfx1150,gfx1152,gfx103X,gfx110X,gfx120X'
      create_release:
        description: 'Create a GitHub release after successful build'
        required: false
        default: true
        type: boolean
      platforms:
        description: 'Platforms to build'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - linux
          - windows
      skip_qualification:
        description: 'Skip gfx1151 GPU qualification (release unqualified)'
        required: false
        default: false
        type: boolean
      self_hosted:
        description: 'Build on dev_lab runners instead of GitHub-hosted'
        required: false
        default: false
        type: boolean
      skip_verify:
        description: 'Skip the torch import smoke test in the build scripts'
        required: false
        default: false
        type: boolean

env:
  GFX_TARGETS: ${{ github.event.inputs.gfx_target || 'gfx1151,gfx1150,gfx1152,gfx103X,gfx110X,gfx120X' }}
  # Pinned deliberately: rc.repo.amd.com/rocm/whl-next is a moving index, so an
  # unpinned "torch==2.14.0" lets each of the 12 matrix jobs (and any re-run
  # days later) resolve a different ROCm stamp — while all of them are published
  # under ONE release tag named after a single ROCm version. Bump these
  # deliberately; build_portable.* read the same variable names.
  TORCH_VER: 2.14.0+rocm10.1.0rc2
  TORCHVISION_VER: 0.29.0a0+rocm10.1.0rc2
  TORCH_INDEX: https://rc.repo.amd.com/rocm/whl-next/

jobs:
  prepare-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      gfx_targets: ${{ steps.set.outputs.gfx_targets }}
      platforms: ${{ steps.set.outputs.platforms }}
      build_linux: ${{ steps.set.outputs.build_linux }}
      build_windows: ${{ steps.set.outputs.build_windows }}
      skip_qualification: ${{ steps.set.outputs.skip_qualification }}
      linux_runner: ${{ steps.set.outputs.linux_runner }}
      windows_runner: ${{ steps.set.outputs.windows_runner }}
    steps:
      - name: Preflight wheel index
        env:
          TORCH_INDEX: ${{ env.TORCH_INDEX }}
          TORCH_VER: ${{ env.TORCH_VER }}
          TORCHVISION_VER: ${{ env.TORCHVISION_VER }}
        run: |
          # Fail here in seconds rather than in 12 parallel build jobs if AMD's
          # index is unreachable from GitHub's egress or the pinned stamp has
          # vanished from it. Both wheel flavours must be present: linux_x86_64
          # for the Linux matrix, win_amd64 for the Windows one.
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 60 "$TORCH_INDEX"torch/ -o idx.html
          curl -fsSL --retry 3 --max-time 60 "$TORCH_INDEX"torchvision/ -o idx_tv.html
          t="torch-${TORCH_VER}"; tb="torch-${TORCH_VER%%+*}"
          grep -qF "$t" idx.html || grep -qF "$tb" idx.html \
            || { echo "::error::torch $TORCH_VER not found on $TORCH_INDEX"; exit 1; }
          v="torchvision-${TORCHVISION_VER}"; vb="torchvision-${TORCHVISION_VER%%+*}"
          grep -qF "$v" idx_tv.html || grep -qF "$vb" idx_tv.html \
            || { echo "::error::torchvision $TORCHVISION_VER not found on $TORCH_INDEX"; exit 1; }
          grep -qF 'win_amd64.whl' idx.html \
            || { echo "::error::no win_amd64 wheels on $TORCH_INDEX"; exit 1; }
          echo "Index OK ($TORCH_INDEX)"

      - name: Set matrix
        id: set
        env:
          PLATFORMS_IN: ${{ github.event.inputs.platforms }}
          SKIP_QUAL: ${{ github.event.inputs.skip_qualification }}
          SELF_HOSTED: ${{ github.event.inputs.self_hosted }}
        run: |
          echo "gfx_targets=$GFX_TARGETS" >> "$GITHUB_OUTPUT"
          matrix=$(echo "$GFX_TARGETS" \
            | tr ',' '\n' \
            | sed 's/^ *//;s/ *$//' \
            | jq -R . \
            | jq -s '{gfx_target:.}' \
            | jq -c)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Generated matrix: $matrix"
          echo "platforms=${PLATFORMS_IN:-both}" >> "$GITHUB_OUTPUT"
          echo "skip_qualification=${SKIP_QUAL:-false}" >> "$GITHUB_OUTPUT"
          # Emit explicit booleans. Do NOT gate the jobs with
          # contains(platforms, 'linux'): contains() on two strings is a
          # SUBSTRING test, so contains('both', 'linux') is false and the
          # default 'both' would skip every build.
          platforms="${PLATFORMS_IN:-both}"
          if [ "$platforms" = windows ]; then build_linux=false; else build_linux=true; fi
          if [ "$platforms" = linux ]; then build_windows=false; else build_windows=true; fi
          echo "build_linux=$build_linux" >> "$GITHUB_OUTPUT"
          echo "build_windows=$build_windows" >> "$GITHUB_OUTPUT"
          # runs-on accepts a scalar, a label array or a {group, labels} map, so
          # emit the whole runner spec from one place and let the jobs fromJSON
          # it. The self-hosted form keeps the original group+labels semantics.
          if [ "$SELF_HOSTED" = "true" ]; then
            echo 'linux_runner={"group":"dev_lab","labels":["self-hosted","Linux"]}' >> "$GITHUB_OUTPUT"
            echo 'windows_runner={"group":"dev_lab","labels":["self-hosted","Windows"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'linux_runner="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
            echo 'windows_runner="windows-2025"' >> "$GITHUB_OUTPUT"
          fi

  # Builds each target's Linux portable bundle. Needs no GPU: it downloads a
  # standalone CPython, the ROCm torch wheels, then trims the result. The
  # in-script import smoke test passes on a GPU-less runner (HIP only needs its
  # driver at device-enumeration time), so VERIFY can stay on here.
  build-linux:
    needs: [prepare-matrix]
    runs-on: ${{ fromJSON(needs.prepare-matrix.outputs.linux_runner) }}
    if: needs.prepare-matrix.outputs.build_linux == 'true'
    timeout-minutes: 90
    env:
      VERIFY: ${{ github.event.inputs.skip_verify == 'true' && '0' || '1' }}
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false
    outputs:
      torch_version: ${{ steps.outputs.outputs.torch_version }}
      thenoise_version: ${{ steps.outputs.outputs.thenoise_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build portable bundle
        run: |
          bash build-scripts/build_portable.sh "${{ matrix.gfx_target }}"

      - name: Create release archive (preserves symlinks)
        run: |
          # tar the bundle directly so symlinks (libfoo.so -> libfoo.so.N,
          # clang-*) stay as links. upload-artifact's zip does NOT preserve
          # symlinks and would expand each into a full copy of its target,
          # bloating the release artifact. tar also keeps the hidden per-gfx
          # GPU code-object dirs (torch/.kpack/, _rocm_sdk_*/.kpack/,
          # .devel_links/) that ROCm wheels ship.
          ARCHIVE="${{ runner.temp }}/thenoise-${{ matrix.gfx_target }}-x64.tar.gz"
          tar -czf "$ARCHIVE" -C "${{ env.THENOISE_ROOT }}" .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thenoise-rocm-${{ matrix.gfx_target }}-x64
          path: ${{ env.ARCHIVE }}
          retention-days: 30
          compression-level: 6

      - name: Set job outputs
        id: outputs
        run: |
          # Read the versions from installed *metadata* instead of importing
          # torch: identical version strings (so the rocm<...> tag parse is
          # unchanged) but no LD_LIBRARY_PATH dance and no dependence on the HIP
          # runtime loading on a GPU-less runner image.
          PY="${{ env.THENOISE_ROOT }}/bin/python3.14"
          tv=$("$PY" -c "import importlib.metadata as m; print(m.version('torch'))")
          nv=$("$PY" -c "import importlib.metadata as m; print(m.version('thenoise'))")
          echo "torch_version=$tv" >> "$GITHUB_OUTPUT"
          echo "thenoise_version=$nv" >> "$GITHUB_OUTPUT"

  # Builds each target's Windows portable bundle (build-scripts/build_portable.ps1).
  # The release archive is a zip (bsdtar writes a zip when the output ends in
  # .zip); there are no symlinks on a Windows bundle so zip is fine and
  # Explorer-friendly.
  build-windows:
    needs: [prepare-matrix]
    runs-on: ${{ fromJSON(needs.prepare-matrix.outputs.windows_runner) }}
    if: needs.prepare-matrix.outputs.build_windows == 'true'
    timeout-minutes: 90
    env:
      VERIFY: ${{ github.event.inputs.skip_verify == 'true' && '0' || '1' }}
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false
    outputs:
      torch_version: ${{ steps.outputs.outputs.torch_version }}
      thenoise_version: ${{ steps.outputs.outputs.thenoise_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build portable bundle
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build-scripts/build_portable.ps1 "${{ matrix.gfx_target }}"

      - name: Create release archive (zip)
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "thenoise-${{ matrix.gfx_target }}-win-x64.zip"
          # -a lets bsdtar auto-detect the format from the .zip extension and
          # write a real zip (without -a it writes a gzip tar).
          tar -a -cf $archive -C $env:THENOISE_ROOT .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # AppendAllText writes UTF-8 without a BOM (Out-File -Encoding utf8
          # adds a BOM in Windows PowerShell 5.1, which corrupts GITHUB_ENV).
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "ARCHIVE=$archive`r`n")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thenoise-rocm-${{ matrix.gfx_target }}-win-x64
          path: ${{ env.ARCHIVE }}
          retention-days: 30
          compression-level: 6

      - name: Set job outputs
        id: outputs
        shell: powershell
        run: |
          # Metadata, not import — see the Linux job's equivalent step. (DLL
          # resolution on Windows is PATH-based, which is exactly why importing
          # torch here would make the release tag depend on the runner image.)
          $py = Join-Path $env:THENOISE_ROOT "python.exe"
          $tv = (& $py -c "import importlib.metadata as m; print(m.version('torch'))").Trim()
          $nv = (& $py -c "import importlib.metadata as m; print(m.version('thenoise'))").Trim()
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "torch_version=$tv`r`n")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "thenoise_version=$nv`r`n")

  # Real GPU smoke test on the gfx1151 dev_lab box: imports + GPU visibility +
  # one end-to-end Anima generation (incl. first-run torch.compile). Runs only
  # when gfx1151 was built AND qualification was not skipped; skipping it still
  # releases, but the notes say the bundles were never generation-tested.
  qualify-linux:
    needs: [prepare-matrix, build-linux]
    runs-on:
      group: dev_lab
      labels: [self-hosted, Linux]
    # Qualification always takes the dev_lab GPU box, independent of the
    # self_hosted input: builds and qualification are decoupled on purpose
    # (and a gfx1151 iGPU cannot be virtualised).
    if: |
      needs.prepare-matrix.outputs.skip_qualification != 'true' &&
      contains(needs.prepare-matrix.outputs.gfx_targets, 'gfx1151')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download gfx1151 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="${{ runner.temp }}/thenoise-qual"
          DEST="$WORK/bundle"; ZIP="$WORK/artifact.zip"
          mkdir -p "$DEST"
          # actions/download-artifact@v4 is unreliable for multi-GB artifacts on
          # self-hosted runners; pull the zip directly with curl (resumable).
          ART_ID=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
          | python3 -c "import sys,json; print(next((a['id'] for a in json.load(sys.stdin)['artifacts'] if a['name']=='thenoise-rocm-gfx1151-x64'), ''))")
          [ -n "$ART_ID" ] || { echo "::error::gfx1151 artifact not found"; exit 1; }
          ok=0
          for attempt in 1 2 3; do
            if curl -fL --retry 5 --retry-delay 10 --retry-all-errors -C - \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -o "$ZIP" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ART_ID}/zip"; then
              ok=1; break
            fi
            echo "attempt $attempt failed; retrying in 15s"; sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::artifact download failed"; exit 1; }
          # The artifact now holds the release tar.gz (not raw bundle contents);
          # unzip it, then untar so $DEST is the bundle root (bin/, lib/, ...).
          if command -v unzip >/dev/null 2>&1; then unzip -q -o "$ZIP" -d "$WORK/raw"
          else python3 -m zipfile -e "$ZIP" "$WORK/raw"; fi
          rm -f "$ZIP"
          TARBALL=$(find "$WORK/raw" -name '*.tar.gz' | head -n1)
          [ -n "$TARBALL" ] || { echo "::error::no release archive in gfx1151 artifact"; exit 1; }
          tar -xzf "$TARBALL" -C "$DEST"
          rm -rf "$WORK/raw"
          echo "Bundle: $(du -sh "$DEST" | cut -f1)"

      - name: Run GPU qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORK="${{ runner.temp }}/thenoise-qual"
          # The release tar.gz was untarred into $WORK/bundle above, so the
          # bundle root (bin/, lib/, include/) is $WORK/bundle directly.
          ROOT="$WORK/bundle"
          MODEL_DIR="$WORK/anima"
          mkdir -p "$MODEL_DIR"
          bash build-scripts/qualify_thenoise.sh \
            --root "$ROOT" --model-dir "$MODEL_DIR" \
            --out "$WORK/qualification-report.json"

      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-gfx1151
          path: ${{ runner.temp }}/thenoise-qual/*.json
          if-no-files-found: warn

      - name: Clean up
        if: always()
        run: rm -rf "${{ runner.temp }}/thenoise-qual" || true

  # Same GPU smoke test as qualify-linux, but on a Windows dev_lab runner
  # against the Windows bundle (build-scripts/qualify_thenoise.ps1). torch.compile is
  # disabled on Windows (no Triton), so the generation runs in eager mode.
  qualify-windows:
    needs: [prepare-matrix, build-windows]
    runs-on:
      group: dev_lab
      labels: [self-hosted, Windows]
    if: |
      needs.prepare-matrix.outputs.skip_qualification != 'true' &&
      contains(needs.prepare-matrix.outputs.gfx_targets, 'gfx1151')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download gfx1151 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP "thenoise-qual-win"
          New-Item -ItemType Directory -Force $work | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File build-scripts/download_artifact.ps1 `
            -Name "thenoise-rocm-gfx1151-win-x64" `
            -Out (Join-Path $work "artifact.zip")
          # artifact.zip holds the release zip (not raw bundle contents); expand
          # both with bsdtar so $work\bundle is the bundle root (python.exe,
          # Lib\, ...). (Expand-Archive is unreliable on multi-GB archives —
          # its internal cleanup fails on the large bundle, so use tar instead.)
          New-Item -ItemType Directory -Force (Join-Path $work "raw") | Out-Null
          tar -xf (Join-Path $work "artifact.zip") -C (Join-Path $work "raw")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rel = Get-ChildItem (Join-Path $work "raw") -Filter *.zip | Select-Object -First 1
          New-Item -ItemType Directory -Force (Join-Path $work "bundle") | Out-Null
          tar -xf $rel.FullName -C (Join-Path $work "bundle")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force (Join-Path $work "raw") -ErrorAction SilentlyContinue
          Remove-Item -Force (Join-Path $work "artifact.zip") -ErrorAction SilentlyContinue
          $mb = [math]::Round((Get-ChildItem (Join-Path $work "bundle") -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          Write-Host "Bundle: $mb MB"

      - name: Run GPU qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $work = Join-Path $env:RUNNER_TEMP "thenoise-qual-win"
          $root = Join-Path $work "bundle"
          $modelDir = Join-Path $work "anima"
          New-Item -ItemType Directory -Force $modelDir | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File build-scripts/qualify_thenoise.ps1 `
            -Root $root -ModelDir $modelDir -Out (Join-Path $work "qualification-report.json")

      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-gfx1151-win
          path: ${{ runner.temp }}/thenoise-qual-win/*.json
          if-no-files-found: warn

      - name: Clean up
        if: always()
        shell: powershell
        run: Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP "thenoise-qual-win") -ErrorAction SilentlyContinue

  # Attaches every target's Linux and Windows archives to a single release
  # named after the tag. Release creation is optional: automatic on a tag push,
  # opt-in (create_release) on a manual run.
  #
  # Gating rule: release when every job that RAN succeeded and at least one
  # platform produced assets. 'skipped' never blocks (that is how platforms=
  # ... and skip_qualification release), 'failure' always blocks. So a dead
  # Windows runner, or a down GPU box, degrades the release instead of blocking
  # it — and the notes below state exactly what is missing.
  create-release:
    needs: [prepare-matrix, build-linux, build-windows, qualify-linux, qualify-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: |
      always() &&
      needs.prepare-matrix.result == 'success' &&
      (needs.build-linux.result == 'success' || needs.build-windows.result == 'success') &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.qualify-linux.result == 'success' || needs.qualify-linux.result == 'skipped') &&
      (needs.qualify-windows.result == 'success' || needs.qualify-windows.result == 'skipped') &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
      )
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_L: ${{ needs.build-linux.outputs.thenoise_version }}
          TV_L: ${{ needs.build-linux.outputs.torch_version }}
          VERSION_W: ${{ needs.build-windows.outputs.thenoise_version }}
          TV_W: ${{ needs.build-windows.outputs.torch_version }}
        run: |
          # Release tag follows the canonical scheme regardless of trigger:
          # thenoise-<version>-rocm<rocm> (e.g. thenoise-0.9.0-rocm10.1.0rc2).
          # For a tag push, the pushed v* tag is just the trigger — the actual
          # release tag is derived from the build outputs. Linux and Windows
          # build the same torch/thenoise versions, so either platform's
          # outputs define the (shared) tag; prefer Linux, fall back to Windows
          # when only Windows was built (platforms=windows -> empty outputs).
          VERSION="$VERSION_L"; TV="$TV_L"
          if [ -z "$VERSION" ]; then VERSION="$VERSION_W"; TV="$TV_W"; fi
          [ -n "$VERSION" ] || { echo "::error::no version output from any platform"; exit 1; }
          ROCM=$(printf '%s' "$TV" | grep -oP 'rocm[\d.]+' || echo rocm)
          TAG="thenoise-${VERSION}-${ROCM}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "thenoise_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "torch_version=$TV" >> "$GITHUB_OUTPUT"
          echo "Generated release tag: $TAG"

      - name: Create archives per target (split if >1.9 GB for GitHub release limit)
        env:
          GFX_TARGETS: ${{ needs.prepare-matrix.outputs.gfx_targets }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          upload_files=""
          # split_if_large <base> <ext>: copies are already done by the caller;
          # splits <base>.<ext> into partNN-of-TT parts if it exceeds 1.9 GB.
          split_if_large() {
            local base ext f size_mb
            base="$1"; ext="$2"; f="${base}.${ext}"
            size_mb=$(du -m "$f" | cut -f1)
            if [ "$size_mb" -gt 1900 ]; then
              echo "Splitting $f into parts..."
              split -b 1900M --numeric-suffixes=1 -a 2 --additional-suffix=.$ext \
                "$f" "${base}.part"
              rm "$f"
              parts=( "${base}".part*.${ext} )
              local total total_padded nn
              total=${#parts[@]}; total_padded=$(printf "%02d" "$total")
              for p in "${parts[@]}"; do
                nn="${p##*.part}"; nn="${nn%%.${ext}}"
                mv "$p" "${base}.part${nn}-of-${total_padded}.${ext}"
              done
              echo "$total" > "${base}.partcount"
            fi
          }
          for target in $(echo "$GFX_TARGETS" | tr ',' ' '); do
            # Linux (tar.gz)
            ldir="./artifacts/thenoise-rocm-${target}-x64"
            if [ -d "$ldir" ]; then
              src=$(find "$ldir" -name '*.tar.gz' | head -n1)
              if [ -n "$src" ]; then
                base="${TAG}-${target}-x64"
                # mv, not cp: 12 assets are ~22 GB and a hosted runner has
                # limited free disk; the artifact copy is never read again.
                mv "$src" "${base}.tar.gz"
                split_if_large "$base" "tar.gz"
                upload_files="${upload_files} ${base}".*
              fi
              rm -rf "$ldir"
            else
              echo "::warning::linux artifact for ${target} not found; skipping"
            fi
            # Windows (zip)
            wdir="./artifacts/thenoise-rocm-${target}-win-x64"
            if [ -d "$wdir" ]; then
              src=$(find "$wdir" -name '*.zip' | head -n1)
              if [ -n "$src" ]; then
                base="${TAG}-${target}-win-x64"
                mv "$src" "${base}.zip"    # mv, not cp (see the Linux branch)
                split_if_large "$base" "zip"
                upload_files="${upload_files} ${base}".*
              fi
              rm -rf "$wdir"
            else
              echo "::warning::windows artifact for ${target} not found; skipping"
            fi
          done
          ls -la ${upload_files} 2>/dev/null || true
          echo "UPLOAD_FILES=$upload_files" >> "$GITHUB_ENV"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GFX_TARGETS: ${{ needs.prepare-matrix.outputs.gfx_targets }}
          VERSION: ${{ steps.tag.outputs.thenoise_version }}
          TV: ${{ steps.tag.outputs.torch_version }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          QUAL_LINUX: ${{ needs.qualify-linux.result }}
          QUAL_WINDOWS: ${{ needs.qualify-windows.result }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="${{ github.repository }}"
          # Build the notes from what actually got built and tested, so a
          # degraded release (one platform, or no GPU qualification) is honest
          # about itself instead of silently claiming the usual full set.
          platforms=""
          [ "$LINUX_RESULT" = success ] && platforms="Linux (x64)"
          [ "$WINDOWS_RESULT" = success ] && platforms="${platforms:+$platforms + }Windows (x64)"
          [ -n "$platforms" ] || platforms="none"
          {
            echo "**GPU Targets**: $GFX_TARGETS"
            echo "**TheNoise Version**: $VERSION"
            echo "**PyTorch Version**: $TV"
            echo "**Platforms**: $platforms"
            echo "**Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo 'Portable TheNoise builds for all GPU targets above. Each includes bundled Python, PyTorch ROCm and the ROCm runtime. No separate installation required.'
            echo '* Linux: run `./bin/thenoise`.'
            echo '* Windows: run `thenoise.bat` (torch.compile is disabled on Windows — Triton is Linux-only in the AMD wheel index).'
            if [ "$LINUX_RESULT" != success ]; then
              echo
              echo "> [!WARNING]"
              echo "> No Linux assets in this release (Linux build job: $LINUX_RESULT)."
            fi
            if [ "$WINDOWS_RESULT" != success ]; then
              echo
              echo "> [!WARNING]"
              echo "> No Windows assets in this release (Windows build job: $WINDOWS_RESULT)."
            fi
            if [ "$QUAL_LINUX" != success ] && [ "$QUAL_WINDOWS" != success ]; then
              echo
              echo "> [!WARNING]"
              echo "> **Not GPU-qualified.** No gfx1151 end-to-end generation test ran for this release (linux: $QUAL_LINUX, windows: $QUAL_WINDOWS). These bundles completed the build-time import checks only."
            fi
          } > notes.md
          cat notes.md
          # shellcheck disable=SC2086
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          # shellcheck disable=SC2086
          gh release create "$TAG" --repo "$REPO" \
            --title "v$VERSION" \
            --notes-file notes.md \
            $UPLOAD_FILES

      - name: Attach qualification reports to release (gfx1151)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="${{ github.repository }}"
          rm -rf qual && mkdir -p qual
          if ! gh run download "${{ github.run_id }}" -n qualification-gfx1151 -D qual --repo "$REPO"; then
            echo "::warning::linux qualification artifact not found; skipping"
          else
            if [ -f qual/qualification-report.json ]; then
              cp qual/qualification-report.json "qualification-report-${TAG}-linux.json"
              gh release upload "$TAG" "qualification-report-${TAG}-linux.json" --clobber --repo "$REPO"
            fi
          fi
          rm -rf qual && mkdir -p qual
          if ! gh run download "${{ github.run_id }}" -n qualification-gfx1151-win -D qual --repo "$REPO"; then
            echo "::warning::windows qualification artifact not found; skipping"
          else
            if [ -f qual/qualification-report.json ]; then
              cp qual/qualification-report.json "qualification-report-${TAG}-windows.json"
              gh release upload "$TAG" "qualification-report-${TAG}-windows.json" --clobber --repo "$REPO"
            fi
          fi
