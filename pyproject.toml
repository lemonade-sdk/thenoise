[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thenoise"
version = "0.6.0"
description = "Diffusion inference engine targeting ROCm"
readme = "README.md"
requires-python = ">=3.10"
# NOTE: torch is intentionally NOT listed here.
dependencies = [
    # web server
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    # model code
    "transformers>=4.57.6",
    "safetensors>=0.4.5",
    "einops>=0.7.0",
    "accelerate>=1.6.0",
    "pillow>=11.3.0",
    "comfy-kitchen>=0.2.32",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]
# Download helpers in scripts/ (not needed at runtime).
scripts = ["huggingface-hub>=0.34.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = [
    "thenoise",
    "thenoise.dit",
    "thenoise.dit.krea2",
    "thenoise.dit.qwen_image",
    "thenoise.dit.anima",
    "thenoise.dit.zimage",
    "thenoise.dit.flux2",
    "thenoise.models",
    "thenoise.postprocess",
    "thenoise.samplers",
    "thenoise.ui",
    "thenoise.upscale",
    "thenoise.utils",
    "thenoise.vae",
]

[tool.setuptools.package-data]
# Tokenizer configs.
"thenoise.dit.anima" = ["configs/**/*"]
"thenoise.dit.zimage" = ["configs/**/*"]
"thenoise.dit.krea2" = ["configs/**/*"]
"thenoise.dit.qwen_image" = ["configs/**/*"]
# Committed Sesqui latent upscaler weights.
"thenoise.upscale" = ["weights/**/*"]
# Web UI
"thenoise.ui" = ["**/*"]
